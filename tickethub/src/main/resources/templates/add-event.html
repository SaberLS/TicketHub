<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Add Event</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">Add Event</h1>

      <form
        th:action="@{/add}"
        th:object="${event}"
        method="post"
      >
        <div class="mb-3">
          <label class="form-label">Title:</label>
          <input
            type="text"
            th:field="*{title}"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('title')}"
            th:errors="*{title}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Category:</label>

          <select th:field="*{category}">
            <option value="">Choose category</option>

            <option
              th:each="category : ${categories}"
              th:value="${category}"
              th:text="${category}"
            ></option>
          </select>

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('category')}"
            th:errors="*{category}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Location:</label>
          <input
            type="text"
            th:field="*{location}"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('location')}"
            th:errors="*{location}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Date</label>
          <input
            type="date"
            class="form-control"
            th:field="*{eventDate}"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('eventDate')}"
            th:errors="*{eventDate}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Ticket Price</label>

          <input
            type="number"
            step="0.01"
            min="0"
            class="form-control"
            th:field="*{ticketPrice}"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('ticketPrice')}"
            th:errors="*{ticketPrice}"
          ></div>
        </div>

        <button
          type="submit"
          class="btn btn-success"
        >
          Save Event
        </button>
      </form>
    </div>
  </body>
</html>
